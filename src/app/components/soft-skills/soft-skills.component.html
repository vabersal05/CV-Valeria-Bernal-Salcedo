<section id="soft-skills" class="section soft-skills">
  <div class="wrap">
    <div class="section-head">
      <div>
        <p class="eyebrow">Soft skills</p>
        <h2>How I work</h2>
      </div>
      <span class="section-index">04 / soft skills</span>
    </div>

    <div class="soft-skills__grid">
      @for (s of softSkills; track s.title) {
        <div class="soft-skills__card">
          <h3>{{ s.title }}</h3>
          <p>{{ s.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
